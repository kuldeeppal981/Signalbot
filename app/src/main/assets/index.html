<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignalBot</title>
<style>
:root{--bg:#0E1116;--surf:#161B22;--line:#262D36;--tx:#E6EDF3;--mut:#8B949E;--up:#3DDC97;--dn:#FF6B6B;--warn:#F2B84B;--acc:#58A6FF;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;overflow-y:auto;padding:14px 16px 20px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf)}
nav button{flex:1;padding:13px 0;background:none;border:0;color:var(--mut);font:600 13px system-ui;letter-spacing:.3px}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
h1{font-size:18px;margin:0 0 12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1}
.seg button{flex:1;padding:10px;border:0;background:none;color:var(--mut);font:600 14px system-ui}
.seg button.on{background:var(--acc);color:#04111f}
.btn{width:100%;padding:13px;border-radius:10px;border:0;background:var(--acc);color:#04111f;font:700 15px system-ui;margin-top:10px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);margin-top:8px}
.btn:disabled{opacity:.5}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font:700 12px system-ui;letter-spacing:.5px}
.b-up{background:#12392b;color:var(--up)}.b-dn{background:#3b1c1f;color:var(--dn)}.b-no{background:#3a2f12;color:var(--warn)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){text-align:right;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--mut)}
.dot.u{background:var(--up)}.dot.d{background:var(--dn)}
.chk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-child{border:0}.chk em{font-style:normal;color:var(--mut)}
.big{font-size:22px;font-weight:700;margin:6px 0 2px}
.note{color:var(--mut);font-size:13px;margin:4px 0}
.warn{color:var(--warn);font-size:12px;margin-top:14px}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 5px}
input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:15px system-ui}
.j{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pos{color:var(--up)}.neg{color:var(--dn)}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
<main>
  <section id="t-sig">
    <h1>Signal</h1>
    <div class="row"><div class="seg" id="seg"><button class="on" data-s="NIFTY">Nifty</button><button data-s="BANKNIFTY">Bank Nifty</button></div></div>
    <button class="btn" id="go">Signal check karo</button>
    <button class="btn ghost" id="demo">Demo data se dekho</button>
    <div id="out" style="margin-top:14px"></div>
  </section>
  <section id="t-jr" class="hide"></section>
  <section id="t-st" class="hide">
    <h1>Settings</h1>
    <div class="card">
      <label for="tok">Upstox access token</label>
      <input id="tok" type="password" autocomplete="off" placeholder="Yahan paste karo">
      <p class="note">Token sirf is phone mein save hota hai. Sirf api.upstox.com ko jata hai. Analytics (read-only) token best hai, kyunki isse order nahi lag sakta.</p>
      <label for="cap">Capital (Rs)</label>
      <input id="cap" type="number" inputmode="numeric">
      <label for="rp">Risk per trade (% of capital)</label>
      <input id="rp" type="number" inputmode="decimal" step="0.1">
      <button class="btn" id="save">Save</button>
      <p class="note" id="saved"></p>
    </div>
  </section>
</main>
<nav><button class="on" data-t="sig">SIGNAL</button><button data-t="jr">JOURNAL</button><button data-t="st">SETTINGS</button></nav>
</div>
<script src="engine.js"></script>
<script>
const E = window.SignalEngine;
const $ = (id) => document.getElementById(id);
const ld = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let cfg = Object.assign({ token: '', capital: 20000, riskPct: 2 }, ld('sb_cfg', {}));
let sym = 'NIFTY', last = null;
const inr = (x) => 'Rs ' + Math.round(x).toLocaleString('en-IN');
const f2 = (x) => (x == null ? '-' : Number(x).toFixed(2));
const today = () => E.istDate(Date.now());

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
  ['sig', 'jr', 'st'].forEach((t) => $('t-' + t).classList.toggle('hide', t !== b.dataset.t));
  if (b.dataset.t === 'jr') renderJournal();
});
document.querySelectorAll('#seg button').forEach((b) => b.onclick = () => {
  sym = b.dataset.s;
  document.querySelectorAll('#seg button').forEach((x) => x.classList.toggle('on', x === b));
});

/* ---------- native bridge to Upstox ---------- */
const pending = {};
window.__nativeCb = (id, status, b64) => {
  const p = pending[id]; if (!p) return; delete pending[id];
  let body = '';
  try { body = new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))); } catch (e) {}
  if (status < 0) return p.rej(new Error('Network error: ' + body));
  let j = null; try { j = JSON.parse(body); } catch (e) {}
  if (status === 401) return p.rej(new Error('Token galat ya expire ho gaya. Settings mein naya token daalo.'));
  if (status < 200 || status > 299) {
    const m = j && j.errors && j.errors[0] && j.errors[0].message;
    return p.rej(new Error('Upstox error ' + status + (m ? ': ' + m : '')));
  }
  p.res(j);
};
const api = (path) => new Promise((res, rej) => {
  if (!window.Native) return rej(new Error('Yeh app Android APK ke andar chalani hai.'));
  const id = Math.random().toString(36).slice(2);
  pending[id] = { res, rej };
  window.Native.request(id, 'https://api.upstox.com' + path, cfg.token);
  setTimeout(() => { if (pending[id]) { delete pending[id]; rej(new Error('Timeout. Net check karo.')); } }, 30000);
});

const KEYS = { NIFTY: 'NSE_INDEX|Nifty 50', BANKNIFTY: 'NSE_INDEX|Nifty Bank', VIX: 'NSE_INDEX|India VIX' };

async function loadLive(s) {
  const key = KEYS[s], ek = encodeURIComponent(key);
  const [q, cd, ct] = await Promise.all([
    api('/v2/market-quote/quotes?instrument_key=' + encodeURIComponent(key + ',' + KEYS.VIX)),
    api('/v2/historical-candle/intraday/' + ek + '/1minute'),
    api('/v2/option/contract?instrument_key=' + ek),
  ]);
  const quotes = Object.entries(q.data || {});
  const find = (name) => { const e = quotes.find(([k]) => k.toLowerCase().includes(name)); return e ? e[1].last_price : null; };
  const spot = find(s === 'NIFTY' ? 'nifty 50' : 'nifty bank');
  const vix = find('vix');
  const contracts = ct.data || [];
  const td = today();
  const exps = [...new Set(contracts.map((c) => c.expiry))].filter((d) => d >= td).sort();
  if (!exps.length) throw new Error('Expiry nahi mili.');
  const lotSize = (contracts.find((c) => c.expiry === exps[0]) || {}).lot_size;
  const ch = await api('/v2/option/chain?instrument_key=' + ek + '&expiry_date=' + exps[0]);
  const chain = (ch.data || []).map((r) => ({
    strike: r.strike_price,
    ceKey: r.call_options && r.call_options.instrument_key, ceLtp: r.call_options && r.call_options.market_data.ltp,
    ceOi: r.call_options && r.call_options.market_data.oi,
    peKey: r.put_options && r.put_options.instrument_key, peLtp: r.put_options && r.put_options.market_data.ltp,
    peOi: r.put_options && r.put_options.market_data.oi,
  }));
  return { symbol: s, spot, vix, chain, lotSize: lotSize || (s === 'NIFTY' ? 65 : 30), expiry: exps[0],
    candles: E.parseCandles((cd.data && cd.data.candles) || []), nowMs: Date.now() };
}

/* ---------- demo data (synthetic, for UI testing only) ---------- */
function demoData(s) {
  const base = Date.parse('2026-11-16T09:15:00+05:30'), n = 75, rows = [];
  let p = s === 'NIFTY' ? 24000 : 52000;
  for (let i = 0; i < n; i++) {
    const t = new Date(base + i * 60000 + 19800000).toISOString().slice(0, 19) + '+05:30';
    const o = p; p += (s === 'NIFTY' ? 0.42 : 0.9) + (i % 3 === 0 ? -0.15 : 0.1);
    rows.push([t, o, Math.max(o, p) + 0.5, Math.min(o, p) - 0.5, p, 0, 0]);
  }
  const step = s === 'NIFTY' ? 50 : 100, chain = [];
  for (let k = Math.round(p / step) * step - 10 * step; k <= p + 10 * step; k += step) {
    chain.push({ strike: k, ceKey: 'DEMO', peKey: 'DEMO', ceLtp: Math.max(5, p - k + 110), peLtp: Math.max(5, k - p + 110),
      ceOi: k === Math.round(p / step) * step + 8 * step ? 900000 : 200000, peOi: k === Math.round(p / step) * step - 8 * step ? 900000 : 400000 });
  }
  return { symbol: s, spot: p, vix: 14.2, chain, lotSize: s === 'NIFTY' ? 65 : 30, expiry: 'demo',
    candles: E.parseCandles(rows.reverse()), nowMs: base + n * 60000, demo: true };
}

/* ---------- run ---------- */
const cntKey = () => 'sb_cnt_' + today();
async function run(demo) {
  const out = $('out'), go = $('go');
  go.disabled = true; $('demo').disabled = true;
  out.innerHTML = '<p class="note">Data la raha hoon...</p>';
  try {
    if (!demo && !cfg.token) throw new Error('Pehle Settings mein Upstox token daalo, ya Demo try karo.');
    const d = demo ? demoData(sym) : await loadLive(sym);
    const maxRiskRs = cfg.capital * cfg.riskPct / 100;
    const r = E.analyze(Object.assign({}, d, { signalsToday: demo ? 0 : ld(cntKey(), 0), maxRiskRs }));
    last = { r, d };
    render(r, d, maxRiskRs);
  } catch (e) {
    out.innerHTML = '<div class="card"><span class="badge b-dn">ERROR</span><p>' + e.message + '</p></div>';
  }
  go.disabled = false; $('demo').disabled = false;
}
$('go').onclick = () => run(false);
$('demo').onclick = () => run(true);

function render(r, d, maxRiskRs) {
  const s = r.signal, sn = r.snap;
  const vcls = r.view === 'Bullish' ? 'b-up' : r.view === 'Bearish' ? 'b-dn' : 'b-no';
  let h = '<div class="card"><div class="j"><span class="badge ' + vcls + '">' + r.view.toUpperCase() + '</span>' +
    '<span class="note">' + (d.demo ? 'DEMO DATA' : 'Spot ' + f2(r.spot) + ' | VIX ' + (d.vix == null ? '-' : f2(d.vix))) + '</span></div>';
  if (r.noTrade) {
    h += '<div class="big" style="color:var(--warn)">NO TRADE</div><p class="note">' + r.reason + '</p></div>';
  } else {
    const dn = s.option === 'PE';
    h += '<div class="big" style="color:var(--' + (dn ? 'dn' : 'up') + ')">' + s.indexName + ' ' + s.strike + ' ' + s.option + '</div>' +
      '<p class="note">' + s.strikeType + ' | Expiry ' + d.expiry + ' | Lot ' + s.lotSize + '</p>' +
      '<div class="kv">' +
      '<span>Entry zone</span><span>' + f2(s.entryLo) + ' - ' + f2(s.entryHi) + '</span>' +
      '<span>Stop Loss</span><span class="neg">' + f2(s.sl) + '</span>' +
      '<span>Target 1</span><span class="pos">' + f2(s.t1) + '</span>' +
      '<span>Target 2</span><span class="pos">' + f2(s.t2) + '</span>' +
      '<span>Risk:Reward</span><span>' + s.rr + '</span>' +
      '<span>1 lot cost</span><span>' + inr(s.lotCost) + '</span>' +
      '<span>Risk per lot (SL)</span><span>' + inr(s.riskPerLot) + '</span>' +
      '<span>Lots (risk limit ' + inr(maxRiskRs) + ')</span><span>' + s.lots + '</span>' +
      '<span>Validity</span><span>' + s.validUntil + ' tak</span></div></div>';
  }
  if (!r.noTrade) {
    h += '<div class="card"><b>Extra notes</b>' + r.notes.map((n) => '<p class="note">' + n + '</p>').join('') +
      (d.demo ? '' : '<button class="btn" id="took">Trade liya (journal mein likho)</button>') + '</div>';
  }
  h += '<div class="card"><b>Checklist (score ' + (r.score == null ? '-' : r.score) + '/6)</b>' +
    r.checks.map((c) => '<div class="chk"><span><i class="dot ' + (c.v > 0 ? 'u' : c.v < 0 ? 'd' : '') + '"></i>' + c.name + '</span><em>' + c.t + '</em></div>').join('') + '</div>';
  h += '<div class="card"><b>Levels</b><div class="kv" style="margin-top:8px">' +
    '<span>Opening range</span><span>' + f2(sn.orLow) + ' - ' + f2(sn.orHigh) + '</span>' +
    '<span>5m EMA9 / EMA20</span><span>' + f2(sn.ema9) + ' / ' + f2(sn.ema20) + '</span>' +
    '<span>Day low / high</span><span>' + f2(sn.dayLow) + ' / ' + f2(sn.dayHigh) + '</span>' +
    '<span>Support (max Put OI)</span><span>' + (sn.support || '-') + '</span>' +
    '<span>Resistance (max Call OI)</span><span>' + (sn.resistance || '-') + '</span>' +
    '<span>PCR</span><span>' + (sn.pcr == null ? '-' : f2(sn.pcr)) + '</span></div></div>';
  h += '<p class="warn">Yeh educational signal hai. Market unpredictable hai. Sirf utna risk lo jitna loss seh sakte ho. Yeh financial advice nahi hai.</p>';
  $('out').innerHTML = h;
  const tb = $('took');
  if (tb) tb.onclick = () => {
    const j = ld('sb_journal', []);
    j.unshift({ id: Date.now(), date: today(), idx: s.indexName, opt: s.option, strike: s.strike, entry: s.ltp, sl: s.sl, t1: s.t1,
      lots: Math.max(1, s.lots), lotSize: s.lotSize, exit: null });
    sv('sb_journal', j); sv(cntKey(), ld(cntKey(), 0) + 1);
    tb.disabled = true; tb.textContent = 'Journal mein save ho gaya';
  };
}

/* ---------- journal ---------- */
function renderJournal() {
  const j = ld('sb_journal', []);
  const done = j.filter((x) => x.exit != null);
  const pl = (x) => (x.exit - x.entry) * x.lots * x.lotSize;
  const tot = done.reduce((s, x) => s + pl(x), 0);
  const wins = done.filter((x) => pl(x) > 0).length;
  let h = '<h1>Journal</h1><div class="card"><div class="kv"><span>Closed trades</span><span>' + done.length + '</span>' +
    '<span>Win rate</span><span>' + (done.length ? Math.round(wins * 100 / done.length) + '%' : '-') + '</span>' +
    '<span>Total P&amp;L</span><span class="' + (tot >= 0 ? 'pos' : 'neg') + '">' + inr(tot) + '</span></div></div>';
  if (!j.length) h += '<p class="note">Abhi koi trade nahi. Signal ke baad "Trade liya" dabao.</p>';
  j.forEach((x) => {
    h += '<div class="card"><div class="j"><b>' + x.idx + ' ' + x.strike + ' ' + x.opt + '</b><span class="note">' + x.date + '</span></div>' +
      '<div class="note">Entry ' + f2(x.entry) + ' | SL ' + f2(x.sl) + ' | T1 ' + f2(x.t1) + ' | ' + x.lots + ' lot</div>';
    if (x.exit == null) {
      h += '<div class="row" style="margin-top:8px"><input type="number" inputmode="decimal" id="ex' + x.id + '" placeholder="Exit price"><button class="btn" style="width:auto;margin:0;padding:0 16px" data-id="' + x.id + '">Close</button></div>';
    } else {
      h += '<div class="big ' + (pl(x) >= 0 ? 'pos' : 'neg') + '">' + inr(pl(x)) + '</div><div class="note">Exit ' + f2(x.exit) + '</div>';
    }
    h += '</div>';
  });
  $('t-jr').innerHTML = h;
  $('t-jr').querySelectorAll('button[data-id]').forEach((b) => b.onclick = () => {
    const v = parseFloat($('ex' + b.dataset.id).value);
    if (isNaN(v)) return;
    const arr = ld('sb_journal', []); const it = arr.find((a) => String(a.id) === b.dataset.id);
    if (it) { it.exit = v; sv('sb_journal', arr); renderJournal(); }
  });
}

/* ---------- settings ---------- */
$('tok').value = cfg.token; $('cap').value = cfg.capital; $('rp').value = cfg.riskPct;
$('save').onclick = () => {
  cfg = { token: $('tok').value.trim(), capital: parseFloat($('cap').value) || 20000, riskPct: Math.min(5, parseFloat($('rp').value) || 2) };
  sv('sb_cfg', cfg); $('saved').textContent = 'Save ho gaya.';
};
</script>
</body>
</html>
